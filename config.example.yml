# 基本配置

# 网课平台选择
#   chaoxing: 超星学习通 (默认, 完整支持)
#   icve:     智慧职教 (zjy2.icve.com.cn / 职教云 v2, 支持视频/文档任务点自动完成)
#   zhihuishu: 知到 / 智慧树 (token/cookie 登录 + 课程读取 + 视频刷课心跳)
#   mooc:      中国大学 MOOC (icourse163.org, 实验性支持)
platform: chaoxing

# 是否使用图形登录窗口 (弹窗输入账号/token)
#   true:  弹出图形登录界面 (需 WebView2, Win10/11 自带)
#   false: 使用终端登录 (兼容性最好)
# 图形窗异常时会自动回退终端登录
login_gui: true

# 是否检查更新 (true=启动时检查版本, 发现新版本会弹强制更新窗; false=跳过)
# 自己打包/本地修改版本时建议设为 false
check_update: false

# 智慧职教 (icve) 配置 (platform: icve 时生效)
icve:
  # 登录凭证 access_token (可选): 因职教云登录带阿里云滑块, 需从浏览器手动导出
  #   留空则程序启动时提示粘贴 (推荐); 填入则作为"存档"直接登录, 免每次粘贴
  #   获取: 登录 zjy2.icve.com.cn -> F12 -> 应用/Application -> Cookie 找 Token,
  #         或任一 prod-api 请求头 Authorization: Bearer 后那串 (eyJ 开头)
  access_token: ""
  # 相邻任务点上报间隔秒数 (防风控)
  wait: 3.0
  # 演练模式: true=只显示将完成的任务点不实际上报; false=真实完成 (会修改学习进度)
  dry_run: false

# 知到 / 智慧树 配置 (platform: zhihuishu 时生效)
zhihuishu:
  # 登录凭证 token/cookie (可选): 知到网页登录带滑块, 建议浏览器手动登录后复制凭证。
  #   留空则启动时弹出 Tide 图形登录界面输入。
  #   获取: 登录 onlineweb.zhihuishu.com -> F12 -> 应用/存储 或 网络请求中复制可用 cookie/token。
  access_token: ""
  cookie: ""
  # 可选: 某门课学习页链接或链接里的 recruitAndCourseId。
  #   留空时, Tide 会在知到模式启动后要求输入课程入口。
  study_url: ""
  recruit_and_course_id: ""
  # 每次心跳之间的实际等待秒数 (防风控)
  wait: 3.0
  # 每次心跳累加的"视频秒"步长 (越大心跳越少、墙钟越短)
  heartbeat_step: 60
  # 演练模式: true=只列出将刷的视频不实际提交 (验证链路用); false=真实提交学习进度 (不可逆!)
  dry_run: true

# 是否开启多会话模式
multi_session: true
# 是否开启姓名手机号打码
mask_acc: true
# TUI 最大显示高度 null: 自适应高度
tui_max_height: 25
# 尝试拉取预先上传的人脸图片
fetch_uploaded_face: true
# 会话存档路径
session_path: session/
# 日志文件路径
log_path: logs/
# 试题导出路径
export_path: export/
# 人脸图片路径
face_image_path: faces/

# --------------------

# 任务执行器配置
# 视频
video:
  # 使能
  enable: true
  # 完成等待时间
  wait: 15
  # 播放速度
  speed: 1.0
  # 视频播放汇报率 (没事别改)
  report_rate: 58
  # 秒刷模式: true=一次性上报完整时长 (极易触发风控验证码, 需配合 captcha_manual), false=模拟正常播放
  super_fast: false
  # 并发刷课数: >1 时启用多视频并发 (实测 2-3 较安全, 10 会触发大量验证码)
  concurrent: 3
  # 狂暴模式上报节奏: gap=间隔秒, step=每次增量秒 (默认 10/20 = 2:1 比值, 服务器接受上限)
  gap: 10
  step: 20

# 作业 (章节测验)
work:
  # 使能
  enable: true
  # 是否进行试题导出 可以将 `enable`设置为 false, 从而进行 dry run
  export: false
  # 完成等待时间
  wait: 15
  # 未匹配选项是否随机选择
  fallback_fuzzer: false
  # 作答失败后是否保存
  fallback_save: true

# 文档
document:
  # 使能
  enable: true
  # 完成等待时间
  wait: 15

# 考试
exam:
  # 未匹配选项是否随机选择
  fallback_fuzzer: false
  # 提交前延迟时间
  persubmit_delay: 15
  # 是否需要交互式确认交卷 自动交卷: false 手动确认: true
  confirm_submit: true

# --------------------

# 会话 / 防风控配置 (可整块省略, 省略时使用下方默认值)
session:
  # 相邻请求最小间隔秒数 (拟人化节流, 防风控核心), 越大越安全但越慢
  request_interval: 0.8
  # 请求间隔随机抖动上限秒数, 打破固定频率特征, 实际间隔 = interval + [0, jitter) 随机值
  request_jitter: 0.6
  # 命中验证码/人脸风控后的额外冷却秒数, 避免解完立刻重发再次触发 (验证码风暴)
  captcha_cooldown: 30.0
  # 验证码最大重试次数
  captcha_max_retry: 6
  # 连接错误最大重试次数
  request_max_retry: 5
  # 连接重试间隔基准秒数 (采用指数退避: 第 n 次约 retry_delay * 2^(n-1))
  retry_delay: 5.0

